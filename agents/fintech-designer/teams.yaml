          read: ["**/*"]
          write: ["docs/design/**"]
      - name: read-path-designer
        skills: [verbose-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
      - name: tech-selector
        skills: [verbose-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
      - name: compliance-architect
        skills: [verbose-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
      - name: failure-analyst
        skills: [verbose-worker, factual-reporter]
        domain:
          read: ["**/*"]
          write: ["docs/design/**"]
